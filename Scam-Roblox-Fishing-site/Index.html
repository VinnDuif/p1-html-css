<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Roblox Log-In</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="BoxCenter">
        <div class="LoginBox">
            <h1 class="AddAccount">Add Account</h1>
            <div class="loginform">
                <input class="username" type="username" placeholder="Username/Email/Phone">
            </div>
            <div class="passwordform">
                <input class="password" type="Password" placeholder="Password">
            </div>
            <div class="loginbutton">
                <button class="button">Log In</button>
            </div>
            <a class="forgot" href="#">Forgot Password or Username?</a>
            <div class="onetimecodediv">
                <button class="onetimecode">Email Me a One-Time Code</button>
                <button class="onetimecode">Quick Sign-n</button>
                <button class="onetimecode">Other sign-in Options</button>
            </div>
            <div class="newaccount">
                <a class="createaccount" href="#">Create A New Account</a>
            </div>
        </div>
    </div>
</body>

</html>
